[project]
name = "taco-backend"
version = "0.1.0"
description = "LTX-compatible inference server for taco-desktop"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.0",
    "ltx-core",
    "ltx-pipelines",
    "diffusers>=0.37.0.dev0",
    "sentencepiece",
    "httpx>=0.28.1",
    "torch>=2.9,<2.10",
    "torchaudio>=2.9,<2.10",
    "python-multipart>=0.0.22",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
ltx-core = { path = "/mnt/nvme-1/repos/LTX-2/packages/ltx-core", editable = true }
ltx-pipelines = { path = "/mnt/nvme-1/repos/LTX-2/packages/ltx-pipelines", editable = true }
torch = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
